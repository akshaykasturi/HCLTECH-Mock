# UC4 settings. Change numbers here, not in code.

# Data files, relative to the backend folder.
data:
  cases: data/eval/uc4/cases.jsonl
  logs: data/raw/uc4/logs/requests.jsonl
  metrics: data/raw/uc4/metrics/metrics.csv
  changes: data/raw/uc4/changes/changes.jsonl

evidence:
  # Baseline = this many minutes before window_start (traffic and metrics).
  baseline_minutes: 60
  # Changes are collected from this many minutes before onset_ts up to window_end.
  change_lookback_minutes: 60
  # How many error codes to list in the traffic line.
  top_error_codes: 3
  # A traffic window with this many failing requests or fewer is "isolated".
  min_failures_in_window: 1
  # A window with this many requests or fewer has no useful traffic picture.
  min_requests_in_window: 1

# Route -> owning service and direct dependencies.
# Copied from data/raw/uc4/api_docs/architecture-and-dependencies.md ("Route dependencies").
routes:
  "POST /v1/orders":
    service: orders-api
    dependencies: [payments-svc, inventory-svc]
  "GET /v1/orders/{id}":
    service: orders-api
    dependencies: [orders-db]
  "POST /v1/payments":
    service: payments-api
    dependencies: [bank-gateway]
  "POST /v1/refunds":
    service: payments-api
    dependencies: [payments-svc]
  "GET /v1/inventory/{sku}":
    service: inventory-api
    dependencies: [inventory-db]
  "GET /v1/customers/{id}":
    service: customers-api
    dependencies: [customer-db]
  "GET /v1/search":
    service: search-api
    dependencies: [search-cluster]

rank:
  # Tuned on the validation split by scripts/tune_rank.py (it rewrites these two lines).
  confidence_threshold: 0.825
  near_tie_margin: 0.25
  # A signal only counts for/against a cause when its ratio is above this (or below 1/this).
  # Avoids listing near-neutral signals (ratio 0.9 or 1.1) as evidence.
  min_ratio: 1.2
  # CLARIFY only when evidence is actually missing: a "missing" evidence item, or one of these signals on.
  # Low confidence alone never gives CLARIFY: it gives RECOMMEND with alternatives (see gate.py).
  clarify_signals: [metrics_missing, dep_metrics_missing, auth_fields_missing, isolated_failure,
                    ratelimit_headers_missing]
  # All signals that say "data is missing". Never listed as a way to tell causes apart.
  missing_data_signals: [metrics_missing, dep_metrics_missing, auth_fields_missing, isolated_failure,
                         ratelimit_headers_missing, window_logs_missing]
  # "To tell them apart": signals whose P(on | cause) differs by at least this much between tied causes.
  tell_apart_min_spread: 0.4
  tell_apart_max_signals: 4

# Which evidence items show a signal. First matching pattern wins (fnmatch: * = anything).
# Values are evidence id prefixes. change: items are cited only when marked related.
signal_evidence:
  - [metrics_missing, ["missing:endpoint_metrics"]]
  - [dep_metrics_missing, ["missing:dependency_metrics"]]
  - [auth_fields_missing, ["missing:auth_details"]]
  - [ratelimit_headers_missing, ["missing:rate_limit_headers"]]
  - [isolated_failure, ["missing:other_failures", "missing:other_requests", "traffic:window"]]
  - [window_logs_missing, ["missing:other_requests", "traffic:window"]]
  - ["status_*", ["request:"]]
  - ["code_*", ["request:"]]
  - [msg_tls, ["request:"]]
  - ["dep_*", ["metric:service:"]]
  - [error_rate_spike, ["metric:endpoint:"]]
  - [endpoint_latency_spike, ["metric:endpoint:"]]
  - [traffic_spike, ["metric:endpoint:"]]
  - [latency_near_gateway_timeout, ["request:", "metric:endpoint:"]]
  - [recent_deploy, ["change:"]]
  - [single_client_dominant, ["traffic:window"]]
  - [duplicate_idempotency_keys, ["traffic:window"]]
  - [prior_timeouts, ["traffic:window"]]
  - ["*", ["request:"]]

doc_search:
  # Use embeddings (hybrid search). The tests switch this off with UC4_DOC_SEARCH_DENSE=0 (offline, BM25 only).
  dense: true
  # Reciprocal rank fusion constant: rrf = 1/(rrf_k + rank_bm25) + 1/(rrf_k + rank_dense). 60 is the usual value.
  rrf_k: 60
  # Doc evidence per case: how many sections, and how many sentences each item quotes.
  evidence_k: 3
  quote_sentences: 2
